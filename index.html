<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css" type="text/css">
</head>

<body>

    <header>
        <div class="container-fluid text-center p-4 text-white">
            <h1 class="fw-bold">SportsHub</h1>
            <p>Cerca una squadra, scopri prossime partite e ultimi risultati</p>
            <div class="d-flex justify-content-center">
                <input type="search" name="search" id="search" placeholder="Cerca la tua squadra">
                <button type="button" id="searchBtn" class="btn">Cerca</button>
            </div>
        </div>
    </header>

    <main>
        <div class="container my-3">
            <div class="row">
                <div class="col-12 col-xl-9">
                    <div class="my-3">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="fw-bold mb-0">⭐ Le tue squadre preferite</h4>
                            <button type="button" id="clearFavoritesBtn" class="clearFavoritesBtn d-none">Cancella tutti</button>
                        </div>
                        <p id="favoritesPlaceholder">Cerca una squadra</p>
                        <div id="favorites"></div>
                    </div>

                    <div class="my-3">
                        <h4 class="fw-bold mb-4">Squadre trovate</h4>
                        <p id="searchPlaceholder">Cerca una squadra</p>
                        <div id="results"></div>
                    </div>

                    <div class="my-3 d-none" id="eventsSection">
                        <h4 class="fw-bold mb-4">Dettagli squadra</h4>
                        <div class="card d-flex" id="eventsCard"></div>
                    </div>
                </div>

                <aside class="d-none d-xl-block col-xl-3 my-3">
                    <h4 class="fw-bold mb-4">Top campionati</h4>
                    <ul class="card py-3 px-3" id="leaguesList">
                        <li data-league="Italian Serie A">Serie A</li>
                        <li data-league="English Premier League">Premier League</li>
                        <li data-league="Spanish La Liga">Liga BBVA</li>
                        <li data-league="German Bundesliga">Bundesliga</li>
                        <li data-league="French Ligue 1">Ligue 1</li>
                    </ul>
                </aside>
            </div>
        </div>
    </main>

    <div id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assets/javascript/script.js"></script>
</body>

</html>
